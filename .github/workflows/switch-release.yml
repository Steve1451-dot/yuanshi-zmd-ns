name: Switch build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve native launcher version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read native source version
        id: release
        shell: bash
        run: |
          version="$(sed -n 's/^#define CLOUDGENSHIN_APP_VERSION "\([^"]*\)"$/\1/p' app/src/app_version.hpp)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building yuanshi launcher v$version"

  build:
    name: Build Switch NRO
    needs: version
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install generator dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3-jinja2 python3-jsonschema

      - name: Build NRO
        env:
          OPENNOW_BUILD_JOBS: "4"
          CLOUDGENSHIN_VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/build-switch-msys2.sh

      - name: Upload Switch NRO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yuanshi-endfield-${{ needs.version.outputs.version }}-${{ github.sha }}
          path: build/switch/yuanshi-launcher.nro
          if-no-files-found: error
